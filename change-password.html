<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusion4 - Ganti Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ECEEF1; --surface: #FFFFFF; --surface-2: #F5F6F8;
    --text: #12161C; --text-muted: #5B6472; --border: #DEE2E7;
    --accent: #D9312E; --steel: #243463; --steel-light: #3C5089;
    --success: #178A4C; --success-bg: #E5F6EC;
    --danger: #D9312E; --danger-bg: #FCEAE8;
    --radius-lg: 18px; --radius-md: 12px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 24px 16px 56px; -webkit-tap-highlight-color: transparent;
  }
  .page { max-width: 420px; margin: 0 auto; }
  .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand-logo { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--steel-light);
    display: flex; align-items: center; gap: 8px;
  }
  .eyebrow::before { content: ""; width: 8px; height: 8px; background: var(--accent); display: inline-block; }
  h1.title {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: 30px; line-height: 1; margin: 0; color: var(--steel);
  }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .card-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted); margin: 14px 0 6px;
  }
  .card-label:first-child { margin-top: 0; }
  input[type="text"], input[type="password"] {
    width: 100%; font-family: 'IBM Plex Mono', monospace; font-size: 16px;
    padding: 13px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border);
    background: var(--surface-2); color: var(--text);
  }
  input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  button {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px;
    border: none; border-radius: var(--radius-md); cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-block { display: block; width: 100%; padding: 15px; margin-top: 18px; }
  .btn-primary { background: var(--steel); color: #fff; }

  #msg {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 12px 14px;
    border-radius: var(--radius-md); margin-top: 14px; line-height: 1.5; display: none;
  }
  #msg.ok { background: var(--success-bg); color: var(--success); border-left: 3px solid var(--success); }
  #msg.fail { background: var(--danger-bg); color: var(--danger); border-left: 3px solid var(--danger); }

  footer.hint { text-align:center; font-size:12px; color:var(--text-muted); margin-top:20px; line-height:1.5; }
</style>
</head>
<body>
<div class="page">

  <div class="brand-row">
    <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
    <div>
      <div class="eyebrow">Fusion 4 Engine</div>
      <h1 class="title">Ganti Password</h1>
    </div>
  </div>

  <div class="card">
    <p class="card-label">QrCodeId</p>
    <input type="text" id="txtQrCodeId" placeholder="Contoh: 3Har08032026" autocapitalize="characters">

    <p class="card-label">Password Lama</p>
    <input type="password" id="txtOldPassword" placeholder="Password lama">

    <p class="card-label">Password Baru</p>
    <input type="password" id="txtNewPassword" placeholder="Password baru">

    <p class="card-label">Konfirmasi Password Baru</p>
    <input type="password" id="txtConfirmPassword" placeholder="Ulangi password baru">

    <button id="btnSubmit" class="btn-block btn-primary">Simpan Password Baru</button>
    <div id="msg"></div>
  </div>

  <footer class="hint">Password ini dipakai untuk otorisasi Supervisor/independen saat absen.</footer>

</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCZxGfKdCtCA1O8SzdJuxPPM-UVpWtk3QXQJpLZEBXFPGYPnGbq36b5WBDEruzr95iiQ/exec";

const btnSubmit = document.getElementById('btnSubmit');
const msgEl = document.getElementById('msg');
const txtQrCodeId = document.getElementById('txtQrCodeId');

// Kalau dibuka dari link Badge Digital (?QrCodeId=...), otomatis isi & kunci field-nya
const params = new URLSearchParams(window.location.search);
const qrCodeIdDariUrl = (params.get('QrCodeId') || params.get('qrCodeId') || params.get('qrcodeid') || "").trim().toUpperCase();
if (qrCodeIdDariUrl) {
  txtQrCodeId.value = qrCodeIdDariUrl;
  txtQrCodeId.readOnly = true;
  txtQrCodeId.style.background = "var(--surface-2)";
  txtQrCodeId.style.color = "var(--text-muted)";
  document.getElementById('txtOldPassword').focus();
}

btnSubmit.onclick = async () => {
  const qrCodeId = document.getElementById('txtQrCodeId').value.trim().toUpperCase();
  const oldPassword = document.getElementById('txtOldPassword').value.trim();
  const newPassword = document.getElementById('txtNewPassword').value.trim();
  const confirmPassword = document.getElementById('txtConfirmPassword').value.trim();

  msgEl.style.display = "none";

  if (!qrCodeId || !oldPassword || !newPassword || !confirmPassword) {
    msgEl.className = "fail";
    msgEl.innerText = "❌ Semua kolom wajib diisi.";
    msgEl.style.display = "block";
    return;
  }

  if (newPassword !== confirmPassword) {
    msgEl.className = "fail";
    msgEl.innerText = "❌ Konfirmasi password baru tidak cocok.";
    msgEl.style.display = "block";
    return;
  }

  if (newPassword === oldPassword) {
    msgEl.className = "fail";
    msgEl.innerText = "❌ Password baru harus berbeda dari password lama.";
    msgEl.style.display = "block";
    return;
  }

  btnSubmit.disabled = true;
  btnSubmit.innerText = "Memproses...";

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "CHANGE_PASSWORD_ABSENSI",
        qrCodeId: qrCodeId,
        oldPassword: oldPassword,
        newPassword: newPassword
      }),
      headers: { "Content-Type": "text/plain" }
    });
    const hasil = await res.json();

    if (hasil.status === "SUCCESS") {
      msgEl.className = "ok";
      msgEl.innerText = "✅ " + hasil.message;
      msgEl.style.display = "block";
      document.getElementById('txtOldPassword').value = "";
      document.getElementById('txtNewPassword').value = "";
      document.getElementById('txtConfirmPassword').value = "";
    } else {
      msgEl.className = "fail";
      msgEl.innerText = "❌ " + (hasil.message || "Gagal mengubah password.");
      msgEl.style.display = "block";
    }
  } catch (e) {
    msgEl.className = "fail";
    msgEl.innerText = "❌ Gagal terhubung ke server: " + e.message;
    msgEl.style.display = "block";
  }

  btnSubmit.disabled = false;
  btnSubmit.innerText = "Simpan Password Baru";
};
</script>
</body>
</html>

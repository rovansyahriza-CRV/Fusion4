<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Minimal v2</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:20px;">

<h3>Test Minimal v2 -- Chain Utuh + Perbandingan Resolusi</h3>
<video id="video" width="320" height="240" autoplay muted playsinline style="border:2px solid #333;"></video>
<br><br>
<button id="btnLoadModels" style="padding:12px 24px; font-size:16px;">1. Muat Model</button>
<br><br>
<button id="btnLowRes" style="padding:12px 20px; font-size:15px;" disabled>2a. Kamera RENDAH (480x640) + Deteksi</button>
<br><br>
<button id="btnHighRes" style="padding:12px 20px; font-size:15px;" disabled>2b. Kamera TINGGI (1280x720) + Deteksi</button>

<p id="log" style="white-space:pre-wrap; text-align:left; background:#f0f0f0; padding:10px; margin-top:20px; font-family:monospace; font-size:13px;">Belum mulai.</p>

<script>
const video = document.getElementById('video');
const log = document.getElementById('log');
const btnLoadModels = document.getElementById('btnLoadModels');
const btnLowRes = document.getElementById('btnLowRes');
const btnHighRes = document.getElementById('btnHighRes');

function addLog(msg) {
  const time = new Date().toLocaleTimeString();
  log.innerText += `\n[${time}] ${msg}`;
  console.log(msg);
}

btnLoadModels.onclick = async () => {
  btnLoadModels.disabled = true;
  addLog("Memuat 3 model...");
  const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights";
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    addLog("Semua model OK.");
  } catch (e) {
    addLog("❌ GAGAL load model: " + e.message);
    return;
  }
  btnLowRes.disabled = false;
  btnHighRes.disabled = false;
  addLog("SIAP. Pilih tombol 2a atau 2b.");
};

async function runTest(width, height, label) {
  addLog(`\n=== TEST ${label} (${width}x${height}) ===`);

  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }

  addLog("Membuka kamera...");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: width }, height: { ideal: height } }
    });
    video.srcObject = stream;
    await video.play();
    addLog("Kamera OK. Resolusi aktual: " + video.videoWidth + "x" + video.videoHeight);
  } catch (e) {
    addLog("❌ GAGAL buka kamera: " + e.message);
    return;
  }

  addLog("Tunggu 2 detik biar kamera stabil & Anda siap posisi wajah...");
  await new Promise(r => setTimeout(r, 2000));

  addLog("--- Mulai deteksi (1 CHAIN UTUH, 1x panggilan) ---");
  const startTime = Date.now();

  try {
    const detection = await faceapi
      .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 }))
      .withFaceLandmarks()
      .withFaceDescriptor();

    const elapsed = Date.now() - startTime;

    if (detection) {
      addLog(`✅✅✅ SUKSES dalam ${elapsed}ms! Descriptor length: ${detection.descriptor.length}, score: ${detection.detection.score.toFixed(3)}`);
    } else {
      addLog(`❌ Selesai dalam ${elapsed}ms tapi HASIL NULL (wajah tidak terdeteksi di frame ini). Coba lagi, pastikan wajah di depan kamera.`);
    }
  } catch (e) {
    const elapsed = Date.now() - startTime;
    addLog(`❌ ERROR setelah ${elapsed}ms: ${e.message}`);
  }
}

btnLowRes.onclick = () => runTest(480, 640, "RESOLUSI RENDAH");
btnHighRes.onclick = () => runTest(1280, 720, "RESOLUSI TINGGI");
</script>
</body>
</html>

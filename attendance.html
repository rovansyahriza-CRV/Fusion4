<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Wajah Absensi</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background:#f4f6f8; }
  #wrap { position: relative; width: 320px; margin: 0 auto; }
  video, canvas { border-radius: 12px; object-fit: cover; }
  canvas { position: absolute; top: 0; left: 0; }
  #status { margin-top: 14px; font-weight: bold; font-size: 17px; min-height: 50px; }
  .ok { color: #2f855a; }
  .fail { color: #c53030; }
  .info { color: #2b6cb0; }
  #retryBtn { display:none; margin-top:10px; padding:10px 20px; font-size:16px;
              background:#2b6cb0; color:#fff; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>

<h2>🧑‍💼 Verifikasi Wajah</h2>

<div id="checkpointPicker" style="margin-bottom:16px;">
  <label style="font-weight:bold; display:block; margin-bottom:6px;">Pilih jenis absen:</label>
  <select id="checkpointSelect" style="padding:10px; font-size:16px; border-radius:8px; border:1px solid #ccc; width:250px;">
    <option value="masuk1">🟢 Masuk</option>
    <option value="istirahat">🍽️ Istirahat</option>
    <option value="masuk2">🔄 Masuk Lagi (habis istirahat)</option>
    <option value="pulang">🔴 Pulang</option>
  </select>
  <br><br>
  <button id="btnStart" style="background:#2b6cb0; color:#fff; border:none; padding:10px 24px; font-size:16px; border-radius:8px; cursor:pointer;">Mulai Verifikasi</button>
</div>

<p id="namaTarget" class="info" style="display:none;">Memuat...</p>

<div id="wrap" style="display:none;">
  <video id="video" width="320" height="240" autoplay muted playsinline></video>
  <canvas id="canvas" width="320" height="240"></canvas>
</div>

<p id="status" style="display:none;">Menyiapkan kamera...</p>
<button id="btnSwitchCam" style="display:none; background:#718096; color:#fff; border:none; padding:10px 20px; font-size:16px; border-radius:8px; cursor:pointer;">🔄 Ganti Kamera</button>
<button id="btnScan" style="display:none; background:#2f855a; color:#fff; border:none; padding:12px 28px; font-size:17px; font-weight:bold; border-radius:8px; cursor:pointer; margin-top:8px;">📸 Scan Sekarang</button>
<button id="retryBtn">🔁 Coba Lagi</button>

<script>
// ============ KONFIGURASI ============
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3zeLLKtuj9gAX4u2cSpkpItDZlPGmrR1lNDclRRrAU1ajHmXmwN1s4vUbeZuCDSzroA/exec";
const MATCH_THRESHOLD = 0.55; // makin kecil = makin ketat. 0.5-0.6 disarankan
const EAR_BLINK_THRESHOLD = 0.23; // di bawah ini dianggap mata tertutup
const REQUIRE_LIVENESS = false; // set true kalau sudah siap production (wajib kedip)

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const status = document.getElementById('status');
const namaTarget = document.getElementById('namaTarget');
const retryBtn = document.getElementById('retryBtn');

// Tidak butuh param QR lagi — identitas ditentukan dari hasil cocok wajah
let masterData = [];
let running = false;
let currentFacingMode = "user"; // "user" = depan, "environment" = belakang
let selectedCheckpoint = "masuk1";

const CHECKPOINT_LABELS = {
  masuk1: "Masuk",
  istirahat: "Istirahat",
  masuk2: "Masuk Lagi",
  pulang: "Pulang"
};

document.getElementById('btnStart').onclick = () => {
  selectedCheckpoint = document.getElementById('checkpointSelect').value;
  document.getElementById('checkpointPicker').style.display = "none";
  document.getElementById('wrap').style.display = "block";
  document.getElementById('status').style.display = "block";
  document.getElementById('btnSwitchCam').style.display = "inline-block";
  namaTarget.style.display = "block";
  init();
};

async function startCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
  video.srcObject = stream;
  await video.play();
}

document.getElementById('btnSwitchCam').onclick = async () => {
  currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
  try {
    await startCamera();
    setStatus(`Kamera diganti ke: ${currentFacingMode === "user" ? "Depan" : "Belakang"}`, "info");
  } catch (err) {
    setStatus("❌ Gagal ganti kamera: " + err.message, "fail");
  }
};

function setStatus(text, cls) {
  status.innerText = text;
  status.className = cls || "";
}

function eyeAspectRatio(eye) {
  // eye = array 6 titik landmark mata
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const vertical = (dist(eye[1], eye[5]) + dist(eye[2], eye[4])) / 2;
  const horizontal = dist(eye[0], eye[3]);
  return vertical / horizontal;
}

async function loadMasterData() {
  const res = await fetch(APPS_SCRIPT_URL);
  masterData = await res.json();
}

async function init() {
  try {
    setStatus("Memuat model & data karyawan...");
    const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights";
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    await loadMasterData();

    const enrolledCount = masterData.filter(m => m.descriptor).length;
    if (enrolledCount === 0) {
      namaTarget.innerText = "❌ Belum ada data wajah terdaftar di Face_data";
      namaTarget.className = "fail";
      return;
    }
    namaTarget.innerText = `Arahkan wajah ke kamera untuk absen ${CHECKPOINT_LABELS[selectedCheckpoint]}`;
    namaTarget.className = "info";

    await startCamera();

    setStatus("Posisikan wajah di kamera, lalu tekan tombol Scan.", "info");
    document.getElementById('btnScan').style.display = "inline-block";
  } catch (err) {
    setStatus("❌ ERROR: " + err.message, "fail");
    console.error(err);
  }
}

document.getElementById('btnScan').onclick = () => {
  document.getElementById('btnScan').disabled = true;
  document.getElementById('btnScan').style.display = "none";
  setStatus(REQUIRE_LIVENESS ? "👁️ Silakan kedipkan mata untuk verifikasi hidup..." : "Memproses...", "info");
  running = true;
  runLivenessAndMatch();
};

async function runLivenessAndMatch() {
  let blinkDetected = !REQUIRE_LIVENESS; // kalau liveness dimatikan, anggap lolos otomatis

  if (REQUIRE_LIVENESS) {
    let earHistory = [];
    let attempts = 0;
    const maxAttempts = 150; // ~ batas waktu percobaan (sekitar 15-20 detik tergantung interval)

    while (running && attempts < maxAttempts && !blinkDetected) {
      attempts++;
      const detection = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 }))
        .withFaceLandmarks();

      if (detection) {
        const leftEAR = eyeAspectRatio(detection.landmarks.getLeftEye());
        const rightEAR = eyeAspectRatio(detection.landmarks.getRightEye());
        const avgEAR = (leftEAR + rightEAR) / 2;
        earHistory.push(avgEAR);
        if (earHistory.length > 10) earHistory.shift();

        // deteksi pola: buka -> tertutup -> buka (bukan foto statis)
        if (earHistory.length >= 5) {
          const hadOpen = earHistory.some(v => v > EAR_BLINK_THRESHOLD + 0.05);
          const hadClosed = earHistory.some(v => v < EAR_BLINK_THRESHOLD);
          if (hadOpen && hadClosed) {
            blinkDetected = true;
          }
        }
      }
      await new Promise(r => setTimeout(r, 120));
    }
  } else {
    setStatus("⚠️ Mode testing: liveness check dinonaktifkan sementara", "info");
    await new Promise(r => setTimeout(r, 800)); // jeda kecil biar sempat kebaca statusnya
  }

  if (!blinkDetected) {
    setStatus("❌ Tidak terdeteksi kedipan (kemungkinan foto statis). Absen ditolak.", "fail");
    stopAndRetry();
    return;
  }

  setStatus("✅ Liveness OK. Mencari kecocokan wajah...", "info");

  // ambil 1 frame segar untuk descriptor final
  const finalDetection = await faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 }))
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!finalDetection) {
    setStatus("❌ Wajah tidak terdeteksi saat pengambilan akhir. Coba lagi.", "fail");
    stopAndRetry();
    return;
  }

  // cari kandidat terdekat dari SEMUA data di Face_data yang SUDAH enroll (1:N)
  let best = null;
  let bestDistance = Infinity;
  masterData.forEach(person => {
    if (!person.descriptor) return; // skip yang belum enroll wajah
    const d = faceapi.euclideanDistance(finalDetection.descriptor, person.descriptor);
    if (d < bestDistance) {
      bestDistance = d;
      best = person;
    }
  });

  const matched = best && bestDistance <= MATCH_THRESHOLD;

  if (matched) {
    namaTarget.innerText = `Terdeteksi: ${best.nama}`;
    setStatus(`✅ Cocok! Mencatat absensi ${CHECKPOINT_LABELS[selectedCheckpoint]} untuk ${best.nama}...`, "ok");
  } else {
    namaTarget.innerText = "Wajah tidak dikenali";
    setStatus(`❌ Wajah tidak dikenali di data manapun (jarak terdekat: ${bestDistance.toFixed(3)}). Absen ditolak.`, "fail");
  }

  const lokasi = await getLokasi();
  const result = matched ? await sendAttendance(best.qrCodeId, matched, bestDistance, lokasi) : null;

  if (!matched) {
    stopAndRetry();
    return;
  }

  if (result && result.status === "duplicate") {
    setStatus(`⚠️ ${best.nama} sudah absen ${CHECKPOINT_LABELS[selectedCheckpoint]} hari ini.`, "fail");
  } else if (result && result.status === "ok") {
    setStatus(`✅ Absensi ${CHECKPOINT_LABELS[selectedCheckpoint]} ${best.nama} berhasil dicatat.`, "ok");
  } else if (result && result.status === "error") {
    setStatus(`❌ ${result.message}`, "fail");
    stopAndRetry();
  } else {
    setStatus(`⚠️ Wajah cocok tapi gagal menyimpan ke sheet. Coba lagi.`, "fail");
    stopAndRetry();
  }
}

function getLokasi() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(""); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(`${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`),
      () => resolve(""), // kalau ditolak/gagal, tetap lanjut tanpa lokasi
      { timeout: 5000 }
    );
  });
}

async function sendAttendance(qrCodeId, faceMatched, distance, lokasi) {
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        type: "attendance",
        checkpoint: selectedCheckpoint,
        qrCodeId: qrCodeId,
        faceMatched: faceMatched,
        distance: distance,
        lokasi: lokasi
      }),
      headers: { "Content-Type": "text/plain" }
    });
    return await res.json();
  } catch (e) {
    console.error("Gagal kirim absensi:", e);
    return null;
  }
}

function stopAndRetry() {
  running = false;
  retryBtn.style.display = "inline-block";
}

retryBtn.onclick = () => {
  retryBtn.style.display = "none";
  location.reload();
};

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiMa - Badge Digital</title>
<link rel="manifest" href="./manifest-badge.json">
<meta name="theme-color" content="#E8562C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Badge BiMa">
<link rel="apple-touch-icon" href="./badge-apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./badge-favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./badge-favicon-16.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #F4EFE9; --orange: #E8562C; --orange-dark: #C23F1B;
    --charcoal: #3D3D3D; --text-muted: #8A8580; --border: #E5DED4;
    --danger: #C0392B; --danger-bg: #FBEAE7;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--charcoal);
    margin: 0; padding: 0; min-height: 100vh; -webkit-tap-highlight-color: transparent;
  }
  .page { max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 4px; }
  .topbar-brand { display:flex; align-items:center; gap:8px; }
  .topbar-logo { width:40px; height:40px; object-fit:contain; }
  .topbar-bima { font-size:15px; font-weight:800; color:var(--charcoal); line-height:1.1; }
  .topbar-sub { font-size:9px; color:var(--text-muted); }
  .topbar-title { font-size:19px; font-weight:400; color:var(--charcoal); }
  .topbar-title b { font-weight:800; border-bottom:2px solid var(--orange); }

  .badge-card {
    background: #fff; border-radius: 20px; margin: 0 16px 16px;
    padding: 28px 20px 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    text-align: center; position: relative; z-index: 2;
  }
  .badge-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .badge-foto {
    width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--orange); flex-shrink: 0; background: var(--bg);
  }
  .badge-foto-fallback {
    width: 90px; height: 90px; border-radius: 50%; flex-shrink: 0;
    background: var(--charcoal); color: #fff; font-size: 32px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid var(--orange);
  }
  #qrbox { margin: 0; }
  #qrbox img, #qrbox canvas { border-radius: 10px; }
  .badge-nama { font-size: 20px; font-weight: 700; color: var(--charcoal); margin-bottom: 2px; }
  .badge-jabatan { font-size: 14px; color: var(--orange); font-weight: 600; margin-bottom: 10px; }
  .badge-id { font-size: 12px; color: var(--text-muted); font-family: monospace; }

  .divider { border-top: 1px dashed var(--border); margin: 18px 0; }
  .footer-copyright {
    font-size: 11px; color: var(--text-muted); text-align: center; padding: 20px;
  }
  .btn-ganti {
    display: block; margin: 0 16px 16px; padding: 12px; text-align: center;
    background: #fff; border: 1.5px solid var(--border); border-radius: 12px;
    color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer;
  }

  #pinOverlay {
    position: fixed; inset: 0; background: rgba(61,61,61,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  #pinModal {
    background: #fff; border-radius: 18px; padding: 28px 24px; width: 100%; max-width: 340px;
    text-align: center;
  }
  #pinModal .pin-icon { font-size: 32px; margin-bottom: 8px; }
  #pinModal h3 { margin: 0 0 6px; font-size: 18px; color: var(--charcoal); }
  #pinModal p { margin: 0 0 18px; font-size: 13px; color: var(--text-muted); }
  .pin-boxes { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .pin-box {
    width: 42px; height: 52px; font-size: 24px; font-weight: 700; text-align: center;
    border-radius: 10px; border: 1.5px solid var(--border); background: #FAF7F3;
    color: var(--charcoal); padding: 0;
  }
  .pin-box:focus { outline: none; border-color: var(--orange); background: #fff; }
  .pin-box.filled { border-color: var(--orange); }
  button#btnSubmitPin {
    width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
    border: none; border-radius: 12px; background: var(--orange); color: #fff; cursor: pointer;
  }
  button#btnSubmitPin:active { background: var(--orange-dark); }
  button#btnSubmitPin:disabled { opacity: 0.5; }
  #pinMsg {
    margin-top: 12px; font-size: 13px; padding: 10px; border-radius: 8px;
    background: var(--danger-bg); color: var(--danger); display: none;
  }
</style>
</head>
<body>

<div class="page" id="pageContent" style="display:none;">
  <div class="topbar">
    <div class="topbar-brand">
      <img src="logo-bima.png" alt="BiMa" class="topbar-logo">
      <div>
        <div class="topbar-bima">BiMa</div>
        <div class="topbar-sub">Bilal Mitra Aryatama</div>
      </div>
    </div>
    <div class="topbar-title">Virtual <b>WALLET</b></div>
  </div>

  <div class="badge-card">
    <div class="badge-row">
      <div id="qrbox"></div>
      <img id="badgeFoto" class="badge-foto" style="display:none;" alt="Foto">
      <div id="badgeFotoFallback" class="badge-foto-fallback" style="display:none;"></div>
    </div>
    <div class="badge-nama" id="badgeNama">-</div>
    <div class="badge-jabatan" id="badgeJabatan">-</div>
    <div class="divider"></div>
    <div class="badge-id" id="badgeId">-</div>
    <button id="btnAbsenSekarang" class="btn-block" style="display:block; width:100%; padding:14px; margin-top:16px; font-size:15px; font-weight:700; border:none; border-radius:12px; background:var(--orange); color:#fff; cursor:pointer;">ABSEN</button>
  </div>
  
  <div style="display:flex; gap:10px; margin:10px 36px 0;">
    <button id="btnAjukanIjin" style="flex:1; padding:12px; font-size:14px; font-weight:700; border:1.5px solid var(--orange); border-radius:12px; background:#fff; color:var(--orange); cursor:pointer;">IJIN</button>
    <button id="btnAjukanLembur" style="flex:1; padding:12px; font-size:14px; font-weight:700; border:1.5px solid var(--orange); border-radius:12px; background:#fff; color:var(--orange); cursor:pointer;">LEMBUR</button>
  </div>
  <div style="display:flex; gap:10px; margin:6px 36px 0;">
    <div style="flex:1; text-align:center; font-size:11px; color:var(--text-muted);">ID Voucher: <span id="voucherIjinId">-</span></div>
    <div style="flex:1; text-align:center; font-size:11px; color:var(--text-muted);">ID Voucher: <span id="voucherLemburId">-</span></div>
  </div>

  <div style="background:#fff; border-radius:20px; margin:0 16px 16px; padding:20px; text-align:left; box-shadow:0 8px 24px rgba(0,0,0,0.08);">
    <p class="card-label">Approval Issues</p>
    <div id="approvalIssuesBox" style="min-height:70px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-muted); text-align:center;">Belum ada pengajuan yang perlu diverifikasi.</div>
  </div>
  
  <div class="btn-ganti" id="btnGantiPin">🔁 Ganti PIN / Bukan Anda?</div>
  <a href="change-password.html" id="linkGantiPassword" target="_blank" style="display:block; text-align:center; margin:0 16px 16px; font-size:13px; color:var(--text-muted); text-decoration:none;">🔑 Ganti Password Absen</a>
  <div class="footer-copyright">© PT. Bilal Mitra Aryatama</div>
</div>

<div id="pinOverlay">
  <div id="pinModal">
    <div class="pin-icon">🔒</div>
    <h3>Verifikasi PIN</h3>
    <p>Masukkan PIN Anda untuk menampilkan badge.</p>
    <div class="pin-boxes" id="pinBoxes">
      <input type="password" class="pin-box" inputmode="numeric" maxlength="1" data-idx="0">
      <input type="password" class="pin-box" inputmode="numeric" maxlength="1" data-idx="1">
      <input type="password" class="pin-box" inputmode="numeric" maxlength="1" data-idx="2">
      <input type="password" class="pin-box" inputmode="numeric" maxlength="1" data-idx="3">
      <input type="password" class="pin-box" inputmode="numeric" maxlength="1" data-idx="4">
      <input type="password" class="pin-box" inputmode="numeric" maxlength="1" data-idx="5">
    </div>
    <button id="btnSubmitPin">Tampilkan Badge</button>
    <div id="pinMsg"></div>
  </div>
</div>

<div id="requestOverlay" style="display:none; position:fixed; inset:0; background:rgba(61,61,61,0.55); align-items:center; justify-content:center; z-index:100; padding:20px;">
  <div style="background:#fff; border-radius:18px; padding:24px 20px; width:100%; max-width:360px;">
    <h3 id="requestTitle" style="margin:0 0 12px; font-size:17px; color:var(--charcoal);"></h3>
    <select id="requestArea" style="width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:12px; border-radius:10px; border:1.5px solid var(--border); background:#FAF7F3; box-sizing:border-box; margin-bottom:10px;">
      <option value="">-- Pilih Area --</option>
    </select>
    <textarea id="requestAlasan" rows="4" placeholder="Tulis alasan..." style="width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:12px; border-radius:10px; border:1.5px solid var(--border); background:#FAF7F3; resize:vertical; box-sizing:border-box;"></textarea>
    <button id="btnSubmitRequest" style="width:100%; margin-top:14px; padding:13px; font-size:15px; font-weight:700; border:none; border-radius:12px; background:var(--orange); color:#fff; cursor:pointer;">Kirim Pengajuan</button>
    <button id="btnCancelRequest" style="width:100%; margin-top:8px; padding:12px; font-size:14px; font-weight:600; border:1.5px solid var(--border); border-radius:12px; background:#fff; color:var(--text-muted); cursor:pointer;">Batal</button>
    <div id="requestMsg" style="margin-top:10px; font-size:13px; padding:10px; border-radius:8px; display:none;"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCZxGfKdCtCA1O8SzdJuxPPM-UVpWtk3QXQJpLZEBXFPGYPnGbq36b5WBDEruzr95iiQ/exec";

const pinBoxes = Array.from(document.querySelectorAll('.pin-box'));
const pinMsg = document.getElementById('pinMsg');
const btnSubmitPin = document.getElementById('btnSubmitPin');
const pinOverlay = document.getElementById('pinOverlay');
const pageContent = document.getElementById('pageContent');

pinBoxes[0].focus();

function getPinValue() {
  return pinBoxes.map(b => b.value).join('');
}

function clearPinBoxes() {
  pinBoxes.forEach(b => { b.value = ""; b.classList.remove('filled'); });
  pinBoxes[0].focus();
}

pinBoxes.forEach((box, idx) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
    if (box.value) {
      box.classList.add('filled');
      if (idx < pinBoxes.length - 1) pinBoxes[idx + 1].focus();
      else if (getPinValue().length === pinBoxes.length) submitPin();
    } else {
      box.classList.remove('filled');
    }
  });

  box.addEventListener('keydown', (e) => {
    if (e.key === "Backspace" && !box.value && idx > 0) {
      pinBoxes[idx - 1].focus();
      pinBoxes[idx - 1].value = "";
      pinBoxes[idx - 1].classList.remove('filled');
    }
    if (e.key === "Enter") submitPin();
  });

  box.addEventListener('paste', (e) => {
    e.preventDefault();
    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
    pasted.slice(0, pinBoxes.length).split('').forEach((ch, i) => {
      pinBoxes[i].value = ch;
      pinBoxes[i].classList.add('filled');
    });
    const nextEmpty = pinBoxes.findIndex(b => !b.value);
    (nextEmpty === -1 ? pinBoxes[pinBoxes.length - 1] : pinBoxes[nextEmpty]).focus();
  });
});

async function submitPin() {
  const pin = getPinValue().trim();

  pinMsg.style.display = "none";

  if (!pin) {
    pinMsg.innerText = "❌ PIN wajib diisi.";
    pinMsg.style.display = "block";
    return;
  }

  btnSubmitPin.disabled = true;
  btnSubmitPin.innerText = "Memeriksa...";

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "GET_DIGITAL_BADGE", pin: pin }),
      headers: { "Content-Type": "text/plain" }
    });
    const hasil = await res.json();
    window.currentBadgeData = hasil;
    loadApprovalIssues(hasil.qrCodeId);
    
    if (!hasil.valid) {
      pinMsg.innerText = "❌ " + (hasil.message || "PIN tidak ditemukan.");
      pinMsg.style.display = "block";
      btnSubmitPin.disabled = false;
      btnSubmitPin.innerText = "Tampilkan Badge";
      clearPinBoxes();
      return;
    }

    document.getElementById('badgeNama').innerText = hasil.nama || "-";
    document.getElementById('badgeJabatan').innerText = hasil.kualifikasi || "-";
    document.getElementById('badgeId').innerText = hasil.qrCodeId;
    document.getElementById('linkGantiPassword').href = "change-password.html?QrCodeId=" + encodeURIComponent(hasil.qrCodeId);

    const fotoEl = document.getElementById('badgeFoto');
    const fallbackEl = document.getElementById('badgeFotoFallback');
    if (hasil.fotoUrl) {
      fotoEl.src = hasil.fotoUrl;
      fotoEl.style.display = "block";
      fallbackEl.style.display = "none";
      fotoEl.onerror = () => {
        fotoEl.style.display = "none";
        fallbackEl.style.display = "flex";
        fallbackEl.innerText = (hasil.nama || "?").trim().charAt(0).toUpperCase();
      };
    } else {
      fotoEl.style.display = "none";
      fallbackEl.style.display = "flex";
      fallbackEl.innerText = (hasil.nama || "?").trim().charAt(0).toUpperCase();
    }

    document.getElementById('qrbox').innerHTML = "";
    new QRCode(document.getElementById('qrbox'), {
      text: hasil.qrCodeId,
      width: 120,
      height: 120,
      colorDark: "#3D3D3D",
      colorLight: "#ffffff"
    });

    pinOverlay.style.display = "none";
    pageContent.style.display = "flex";
  } catch (e) {
    pinMsg.innerText = "❌ Gagal terhubung ke server: " + e.message;
    pinMsg.style.display = "block";
    btnSubmitPin.disabled = false;
    btnSubmitPin.innerText = "Tampilkan Badge";
  }
}

btnSubmitPin.onclick = submitPin;

document.getElementById('btnAbsenSekarang').onclick = () => {
  const qrId = (window.currentBadgeData && window.currentBadgeData.qrCodeId) || "";
  if (!qrId) {
    alert("Data belum siap, coba refresh halaman.");
    return;
  }
  window.location.href = "attendance-fusion4.html?QrCodeId=" + encodeURIComponent(qrId) + "&fromBadge=1";
};

document.getElementById('btnGantiPin').onclick = () => {
  pageContent.style.display = "none";
  pinOverlay.style.display = "flex";
  clearPinBoxes();
};

let currentRequestType = "";

async function openRequestForm(type) {
  currentRequestType = type;
  document.getElementById('requestTitle').innerText = type === "IJIN" ? "Ajukan Ijin Keluar" : "Ajukan Lembur";
  document.getElementById('requestArea').style.display = type === "LEMBUR" ? "block" : "none";
  document.getElementById('requestAlasan').value = "";
  document.getElementById('requestMsg').style.display = "none";
  document.getElementById('requestOverlay').style.display = "flex";

  if (type === "LEMBUR") {
    const selectEl = document.getElementById('requestArea');
    selectEl.innerHTML = '<option value="">Memuat area...</option>';
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "GET_LOKASI_LIST" }),
        headers: { "Content-Type": "text/plain" }
      });
      const lokasiList = await res.json();
      selectEl.innerHTML = '<option value="">-- Pilih Area --</option>';
      (lokasiList || []).forEach(nama => {
        const opt = document.createElement('option');
        opt.value = nama;
        opt.innerText = nama;
        selectEl.appendChild(opt);
      });
    } catch (e) {
      selectEl.innerHTML = '<option value="">Gagal memuat area</option>';
    }
  }
}

document.getElementById('btnAjukanIjin').onclick = () => openRequestForm("IJIN");
document.getElementById('btnAjukanLembur').onclick = () => openRequestForm("LEMBUR");

document.getElementById('btnCancelRequest').onclick = () => {
  document.getElementById('requestOverlay').style.display = "none";
};

document.getElementById('btnSubmitRequest').onclick = async () => {
  const qrId = (window.currentBadgeData && window.currentBadgeData.qrCodeId) || "";
  const area = document.getElementById('requestArea').value.trim();
  const alasan = document.getElementById('requestAlasan').value.trim();
  const msgEl = document.getElementById('requestMsg');

  if (currentRequestType === "LEMBUR" && !area) {
    msgEl.style.display = "block";
    msgEl.style.background = "var(--danger-bg)";
    msgEl.style.color = "var(--danger)";
    msgEl.innerText = "❌ Area tidak boleh kosong.";
    return;
  }
  if (!alasan) {
    msgEl.style.display = "block";
    msgEl.style.background = "var(--danger-bg)";
    msgEl.style.color = "var(--danger)";
    msgEl.innerText = "❌ Alasan tidak boleh kosong.";
    return;
  }

  const btn = document.getElementById('btnSubmitRequest');
  btn.disabled = true;
  btn.innerText = "Mengirim...";

  try {
    const action = currentRequestType === "IJIN" ? "SUBMIT_IJIN_REQUEST" : "SUBMIT_LEMBUR_REQUEST";
    const bodyPayload = { action: action, qrCodeId: qrId, alasan: alasan };
    if (currentRequestType === "LEMBUR") bodyPayload.area = area;

    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(bodyPayload),
      headers: { "Content-Type": "text/plain" }
    });
    const hasil = await res.json();

    msgEl.style.display = "block";
    if (hasil.status === "SUCCESS") {
      msgEl.style.background = "var(--success-bg, #E5F6EC)";
      msgEl.style.color = "var(--charcoal)";
      msgEl.innerText = "✅ " + hasil.message;
      setTimeout(() => { document.getElementById('requestOverlay').style.display = "none"; }, 1800);
    } else {
      msgEl.style.background = "var(--danger-bg)";
      msgEl.style.color = "var(--danger)";
      msgEl.innerText = "❌ " + (hasil.message || "Gagal mengirim pengajuan.");
    }
  } catch (e) {
    msgEl.style.display = "block";
    msgEl.style.background = "var(--danger-bg)";
    msgEl.style.color = "var(--danger)";
    msgEl.innerText = "❌ Gagal terhubung ke server: " + e.message;
  }

  btn.disabled = false;
  btn.innerText = "Kirim Pengajuan";
};

  async function loadApprovalIssues(qrId) {
  const box = document.getElementById('approvalIssuesBox');
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "GET_APPROVAL_LIST", qrCodeId: qrId }),
      headers: { "Content-Type": "text/plain" }
    });
    const hasil = await res.json();

    if (!hasil.role || !hasil.items || hasil.items.length === 0) {
      box.style.display = "flex";
      box.style.flexDirection = "row";
      box.innerHTML = "Belum ada pengajuan yang perlu diverifikasi.";
      return;
    }

    box.style.display = "block";
    box.innerHTML = "";
    hasil.items.forEach(item => {
      const row = document.createElement('div');
      row.style.cssText = "border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px; text-align:left;";
      row.innerHTML = `
        <div style="font-size:13px; font-weight:700; color:var(--charcoal);">${item.type} - ${item.nama}</div>
        <div style="font-size:12px; color:var(--text-muted); margin:2px 0 8px;">${item.alasan}</div>
        <div style="display:flex; gap:8px;">
          <button class="btnApprove" data-type="${item.type}" data-id="${item.requestId}" style="flex:1; padding:8px; font-size:12px; font-weight:700; border:none; border-radius:8px; background:var(--orange); color:#fff; cursor:pointer;">Setujui</button>
          <button class="btnReject" data-type="${item.type}" data-id="${item.requestId}" style="flex:1; padding:8px; font-size:12px; font-weight:700; border:1.5px solid var(--border); border-radius:8px; background:#fff; color:var(--text-muted); cursor:pointer;">Tolak</button>
        </div>
      `;
      box.appendChild(row);
    });

    document.querySelectorAll('.btnApprove').forEach(btn => {
      btn.onclick = () => handleApprovalDecision(btn.dataset.type, btn.dataset.id, "APPROVE", qrId);
    });
    document.querySelectorAll('.btnReject').forEach(btn => {
      btn.onclick = () => handleApprovalDecision(btn.dataset.type, btn.dataset.id, "REJECT", qrId);
    });
  } catch (e) {
    box.style.display = "flex";
    box.innerHTML = "Gagal memuat data approval.";
  }
}

async function handleApprovalDecision(type, requestId, decision, approverQrId) {
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "PROCESS_APPROVAL", type: type, requestId: requestId, qrCodeId: approverQrId, decision: decision }),
      headers: { "Content-Type": "text/plain" }
    });
    const hasil = await res.json();
    alert(hasil.message || "Diproses.");
    loadApprovalIssues(approverQrId);
  } catch (e) {
    alert("Gagal memproses: " + e.message);
  }
}
  
</script>
</body>
</html>

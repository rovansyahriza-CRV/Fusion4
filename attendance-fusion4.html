<style>
  :root {
    --bg: #ECEEF1; --surface: #FFFFFF; --surface-2: #F5F6F8;
    --text: #12161C; --text-muted: #5B6472; --border: #DEE2E7;
    --accent: #D9312E; --accent-dark: #B32220; --accent-bg: #FBEAEA;
    --steel: #243463; --steel-light: #3C5089;
    --success: #178A4C; --success-bg: #E5F6EC;
    --danger: #D9312E; --danger-bg: #FCEAE8;
    --warn: #B8860B; --warn-bg: #FBF3DC;
    --radius-lg: 18px; --radius-md: 12px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 24px 16px 56px; -webkit-tap-highlight-color: transparent;
  }
  .page { max-width: 440px; margin: 0 auto; }
  .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand-logo { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; flex-shrink: 0; }
  .brand-fallback {
    background: var(--steel); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--steel-light);
    display: flex; align-items: center; gap: 8px;
  }
  .eyebrow::before { content: ""; width: 8px; height: 8px; background: var(--accent); display: inline-block; }
  h1.title {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: 30px; line-height: 1; margin: 0; color: var(--steel);
  }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; }
  .card-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
  input[type="text"], input[type="password"] {
    width: 100%; font-family: 'IBM Plex Mono', monospace; font-size: 16px;
    padding: 13px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border);
    background: var(--surface-2); color: var(--text);
  }
  input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  button {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px;
    border: none; border-radius: var(--radius-md); cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-block { display: block; width: 100%; padding: 15px; margin-top: 10px; }
  .btn-primary { background: var(--steel); color: #fff; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface-2); color: var(--steel); border: 1.5px solid var(--border); }

  #locBanner, #resultBanner {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 12px 14px;
    border-radius: var(--radius-md); margin-bottom: 14px; line-height: 1.5; display: none;
  }
  .banner-info { background: var(--surface-2); color: var(--steel); border-left: 3px solid var(--steel-light); }
  .banner-ok { background: var(--success-bg); color: var(--success); border-left: 3px solid var(--success); }
  .banner-fail { background: var(--danger-bg); color: var(--danger); border-left: 3px solid var(--danger); }
  .banner-warn { background: var(--warn-bg); color: var(--warn); border-left: 3px solid var(--warn); }

  #wrap {
    position: relative; width: 100%; aspect-ratio: 1/1; margin: 0 auto 14px;
    overflow: hidden; border-radius: var(--radius-lg); background: #0B0D10; display: none;
  }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .reticle { position: absolute; inset: 22px; pointer-events: none; }
  .reticle span { position: absolute; width: 26px; height: 26px; border: 3px solid var(--accent); }
  .reticle span:nth-child(1){ top:0; left:0; border-right:none; border-bottom:none; border-top-left-radius:6px; }
  .reticle span:nth-child(2){ top:0; right:0; border-left:none; border-bottom:none; border-top-right-radius:6px; }
  .reticle span:nth-child(3){ bottom:0; left:0; border-right:none; border-top:none; border-bottom-left-radius:6px; }
  .reticle span:nth-child(4){ bottom:0; right:0; border-left:none; border-top:none; border-bottom-right-radius:6px; }

  #faceGuideOval {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 58%; height: 74%;
    border: 4px solid var(--steel-light);
    border-radius: 50%;
    display: none;
    pointer-events: none;
    transition: border-color 0.15s ease;
  }
  #faceGuideOval.warn { border-color: #D97706; }
  #faceGuideOval.ok { border-color: var(--success); }
  #faceGuideHint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(11,13,16,0.72); color: #fff;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 5px 12px; border-radius: 999px;
    display: none; white-space: nowrap;
  }
  #qrGuide {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 68%; aspect-ratio: 1/1; border: 3px dashed var(--accent); border-radius: 12px;
    display: none; pointer-events: none; box-shadow: 0 0 0 999px rgba(0,0,0,.35);
  }

  #status { font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--text);
    background:var(--surface-2); border-left:3px solid var(--steel-light); border-radius:0 8px 8px 0;
    padding:10px 12px; margin:0 0 14px; line-height:1.5; display:none; }
  #status.ok { border-left-color: var(--success); }
  #status.fail { border-left-color: var(--danger); }

  .badge { display:inline-block; padding:8px 20px; border-radius:999px; color:#fff; font-weight:700; font-size:16px; }
  .badge-masuk1{ background:#22c55e; } .badge-istirahat{ background:#f59e0b; }
  .badge-masuk2{ background:#2563eb; } .badge-pulang{ background:#ef4444; }

  footer.hint { text-align:center; font-size:12px; color:var(--text-muted); margin-top:20px; line-height:1.5; }
</style>

<body>

<script>
// ============ KONFIGURASI ============
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCZxGfKdCtCA1O8SzdJuxPPM-UVpWtk3QXQJpLZEBXFPGYPnGbq36b5WBDEruzr95iiQ/exec";
const FACE_MATCH_THRESHOLD = 0.45; // diperketat dari 0.55 -- kurangi resiko salah kenali orang

// ============ MIGRASI SUPABASE (Absensi + Lembur + Ijin Keluar) ============
// Aksi lain (GET_PERSON_DATA, FIND_NEAREST_LOCATION, GET_ALL_FACE_DATA, dll) TETAP
// lewat Apps Script (APPS_SCRIPT_URL) seperti biasa -- cuma 4 hal ini yang dipindah:
// submit absensi reguler+lembur, CHECK_IJIN_PENDING, SUBMIT_IJIN_KELUAR, SUBMIT_LEMBUR.
const SUPABASE_URL = 'https://nhmpwjriextmbotmvvbu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XNqLw7iz873TtrLn9ag8dQ_AkL2rImz';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
let qrCodeId = (params.get('QrCodeId') || params.get('qrCodeId') || params.get('qrcodeid') || "").trim().toUpperCase();
let fromBadge = (params.get('fromBadge') === '1');

let activeLocation = "";
let currentPerson = null;
let refDescriptor = null;
let faceVerified = false;
let matchMode = "1:1"; // "1:1" (QR dulu, verifikasi ke 1 orang) atau "1:N" (wajah dulu, cari dari semua)
let allFaceData = null; // cache daftar semua descriptor, buat mode 1:N
let pendingPindahReminder = null;
let isOfflineMode = false;
let offlineGPS = null;

const CACHE_KEY_FACES = "fusion4_cached_faces";
async function getCachedFaces() {
  try {
    const raw = localStorage.getItem(CACHE_KEY_FACES);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
async function syncFaceCache() {
  try {
    const { data, error } = await supabaseClient.rpc('get_all_face_data');
    if (!error && data) localStorage.setItem(CACHE_KEY_FACES, JSON.stringify(data));
  } catch (e) { console.warn("Sync cache wajah gagal:", e.message); }
}

const locBanner = document.getElementById('locBanner');
const resultBanner = document.getElementById('resultBanner');
const statusEl = document.getElementById('status');
const wrap = document.getElementById('wrap');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const qrGuide = document.getElementById('qrGuide');
const qrCard = document.getElementById('qrCard');
const btnScanFace = document.getElementById('btnScanFace');
const passwordCard = document.getElementById('passwordCard');
const voucherCard = document.getElementById('voucherCard');
const btnRetry = document.getElementById('btnRetry');
const faceGuideOval = document.getElementById('faceGuideOval');
const faceGuideHint = document.getElementById('faceGuideHint');
let qrScanning = false;
let guideLoopActive = false;
let lastGuideOk = false;
let currentFacingModeFace = "user"; // default depan buat wajah sendiri

document.getElementById('btnSwitchFaceCam').onclick = async () => {
  currentFacingModeFace = currentFacingModeFace === "user" ? "environment" : "user";
  stopGuideLoop();
  try {
    await restartCameraStream(currentFacingModeFace);
    guideLoop();
    setStatus(`Kamera diganti ke: ${currentFacingModeFace === "user" ? "Depan" : "Belakang"}`, "info");
  } catch (e) {
    setStatus("❌ Gagal ganti kamera: " + e.message, "fail");
  }
};

function evaluateFaceBox(box) {
  if (!video.videoWidth || !video.videoHeight) return { ok: false, reason: "Kamera belum siap" };
  const widthRatio = box.width / video.videoWidth;
  const centerX = box.x + box.width / 2;
  const centerY = box.y + box.height / 2;
  const offsetX = Math.abs(centerX - video.videoWidth / 2) / video.videoWidth;
  const offsetY = Math.abs(centerY - video.videoHeight / 2) / video.videoHeight;

  if (widthRatio < 0.28) return { ok: false, reason: "Terlalu jauh, dekatkan wajah" };
  if (widthRatio > 0.68) return { ok: false, reason: "Terlalu dekat, jauhkan sedikit" };
  if (offsetX > 0.18 || offsetY > 0.18) return { ok: false, reason: "Geser wajah ke tengah" };
  return { ok: true, reason: "Posisi bagus" };
}

function guideLoop() {
  // Guide statis -- TIDAK ada deteksi berulang (matiin sumber WebGL rebutan
  // yang bikin iOS Safari hang). Oval cuma jadi panduan visual posisi,
  // validasi sebenarnya jalan sekali pas tombol Scan ditekan.
  faceGuideOval.style.display = "block";
  faceGuideOval.className = "";
  faceGuideHint.style.display = "block";
  faceGuideHint.innerText = "Posisikan wajah di dalam oval, lalu tekan Scan Wajah";
  guideLoopActive = true;
}

function stopGuideLoop() {
  guideLoopActive = false;
  faceGuideOval.style.display = "none";
  faceGuideHint.style.display = "none";
  document.getElementById("btnSwitchFaceCam").style.display = "none";
}

function showBanner(el, text, kind) {
  el.style.display = "block";
  el.className = "banner-" + kind;
  el.innerText = text;
}
function setStatus(text, kind) {
  statusEl.style.display = "block";
  statusEl.className = kind || "";
  statusEl.innerText = text;
}
function showRetry() {
  btnRetry.style.display = "block";
}
btnRetry.onclick = () => location.reload();

async function callApi(action, extra) {
  extra = extra || {};

  // 1. GPS FIND_NEAREST_LOCATION -- Supabase Haversine RPC
  if (action === "FIND_NEAREST_LOCATION") {
    const { data, error } = await supabaseClient.rpc('find_nearest_location', {
      p_lat: extra.lat,
      p_lng: extra.lng
    });
    if (error) throw new Error(error.message);
    return data;
  }

  // 2. GET_ALL_FACE_DATA -- Supabase RPC
  if (action === "GET_ALL_FACE_DATA") {
    const { data, error } = await supabaseClient.rpc('get_all_face_data');
    if (error) throw new Error(error.message);
    return data;
  }

  // 3. GET_PERSON_DATA / GET_FACE_DESCRIPTOR -- Supabase RPC
  if (action === "GET_PERSON_DATA" || action === "GET_FACE_DESCRIPTOR") {
    const qrId = extra.qrCodeId || extra.qrcodeid || "";
    const { data, error } = await supabaseClient.rpc('get_person_face_data', {
      p_qrcode: qrId
    });
    if (error) throw new Error(error.message);
    return data;
  }

  // 4. CHECK_IJIN_PENDING -- Supabase RPC
  if (action === "CHECK_IJIN_PENDING") {
    const { data, error } = await supabaseClient.rpc('check_ijin_keluar_pending', { p_qrcodeid: extra.qrCodeId });
    if (error) throw new Error(error.message);
    return data;
  }

  // 5. SUBMIT_IJIN_KELUAR -- Supabase RPC
  if (action === "SUBMIT_IJIN_KELUAR") {
    const { data, error } = await supabaseClient.rpc('submit_ijin_keluar', {
      p_qrcodeid: extra.qrCodeId, p_lokasi: extra.lokasi, p_kodeijin: extra.kodeIjin
    });
    if (error) throw new Error(error.message);
    return data;
  }

  // 6. SUBMIT_LEMBUR -- Supabase RPC
  if (action === "SUBMIT_LEMBUR") {
    const { data, error } = await supabaseClient.rpc('submit_absensi_lembur', {
      p_qrcodeid: extra.qrCodeId, p_lokasi: extra.lokasi, p_pinvoucher: extra.pinVoucher || ""
    });
    if (error) throw new Error(error.message);
    return data;
  }

  // 7. PINDAH LOKASI -- Supabase RPC
  if (action === "SUBMIT_PINDAH_LOKASI") {
    const { data, error } = await supabaseClient.rpc('submit_pindah_lokasi', {
      p_qrcode: extra.qrCodeId,
      p_lokasi_tujuan: extra.lokasiTujuan,
      p_alasan: extra.alasan || "",
      p_lokasi_lama: extra.lokasiLama || ""
    });
    if (error) throw new Error(error.message);
    return data;
  }

  if (action === "GET_PINDAH_STATUS") {
    const { data, error } = await supabaseClient.rpc('get_pindah_lokasi_status', {
      p_qrcode: extra.qrCodeId
    });
    if (error) throw new Error(error.message);
    return data;
  }

  // Fallback jika ada aksi lain
  const body = Object.assign({ action: action }, extra);
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(body),
    headers: { "Content-Type": "text/plain" }
  });
  return await res.json();
}

// SUBMIT_ABSENSI (reguler + lembur) -- sudah dipindah ke Supabase RPC submit_absensi()
async function submitAbsensiCall(qrCodeId, lokasi, password) {
  const { data, error } = await supabaseClient.rpc('submit_absensi', {
    p_qrcodeid: qrCodeId, p_lokasi: lokasi, p_password: password || ""
  });
  if (error) throw new Error(error.message);
  return data;
}

function getGeolocationPromise(options) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      return reject(new Error("Browser tidak mendukung GPS."));
    }
    navigator.geolocation.getCurrentPosition(resolve, reject, options);
  });
}

// ============ 1. GPS ============
async function initGPS() {
  showBanner(locBanner, "📍 Mendeteksi lokasi GPS Anda...", "info");

  if (!navigator.geolocation) {
    showBanner(locBanner, "❌ Browser tidak mendukung fitur GPS.", "fail");
    return;
  }

  let pos = null;

  // Tier 1: Coba High Accuracy (Satelit) dengan timeout 7 detik & cache 30s
  try {
    pos = await getGeolocationPromise({
      enableHighAccuracy: true,
      timeout: 7000,
      maximumAge: 30000
    });
  } catch (err1) {
    console.warn("GPS High Accuracy lambat/indoor, fallback ke Network Location...", err1.message);
    // Tier 2: Fallback ke Network / WiFi / Cell Location (cepat & tembus indoor)
    try {
      pos = await getGeolocationPromise({
        enableHighAccuracy: false,
        timeout: 6000,
        maximumAge: 60000
      });
    } catch (err2) {
      console.error("GPS Fallback gagal:", err2.message);
      let pesan = "Gagal membaca lokasi GPS.";
      if (err2.code === 1) pesan = "Izin lokasi ditolak. Aktifkan GPS & Izin Lokasi di browser HP.";
      else if (err2.code === 2) pesan = "Sinyal GPS tidak terdeteksi. Nyalakan WiFi/GPS di HP.";
      else if (err2.code === 3) pesan = "Waktu pencarian GPS habis. Pastikan GPS HP aktif.";

      showBanner(locBanner, "🔴 " + pesan, "fail");
      showRetry();
      return;
    }
  }

  if (!pos || !pos.coords) {
    showBanner(locBanner, "🔴 Gagal mengunci koordinat GPS. Coba lagi.", "fail");
    showRetry();
    return;
  }

  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  offlineGPS = { lat, lng };

  showBanner(locBanner, "🟢 GPS terkunci. Menyelaraskan dengan server...", "info");
  try {
    const result = await callApi("FIND_NEAREST_LOCATION", { lat: lat, lng: lng });
    handleLocationResult(result);
  } catch (e) {
    console.warn("Gagal hubungi server lokasi, aktifkan mode offline:", e.message);
    isOfflineMode = true;

function handleLocationResult(result) {
  if (!result || typeof result !== 'object') {
    showBanner(locBanner, "🔴 Lokasi tidak ditemukan.", "fail");
    return;
  }
  const isInside = (result.IsInsideRadius !== undefined) ? result.IsInsideRadius : !!result.inRange;
  const namaLok = result.NamaLokasi || result.location || "Unmapped";
  const dist = result.Distance ?? result.distance ?? "-";
  const rad = result.Radius ?? result.radius ?? "-";

  if (!isInside) {
    showBanner(locBanner, "🔴 Di luar area absensi (" + namaLok + " - Jarak: " + dist + "m, Radius: " + rad + "m)", "fail");
    return;
  }
  activeLocation = String(namaLok).trim();
  showBanner(locBanner,
    "🟢 Kelompok: " + activeLocation + " | Jarak: " + dist + "m | Radius: " + rad + "m",
    "ok");

  setStatus("Pilih cara absen di bawah ini.", "info");
  document.getElementById('entryCard').style.display = "block";
}

// Mode 1:N -- scan wajah dulu, sistem cari sendiri orangnya dari SEMUA yang sudah enroll
let faceModelsAlreadyLoaded = false;

async function loadFaceModelsWithBackendFix() {
  if (faceModelsAlreadyLoaded) return;

  try {
    if (faceapi.tf && faceapi.tf.ENV) {
      faceapi.tf.ENV.set('WEBGL_PACK', false);
      faceapi.tf.ENV.set('WEBGL_CHECK_NUMERICAL_PROBLEMS', false);
      faceapi.tf.ENV.set('WEBGL_FORCE_F16_TEXTURES', false);
      faceapi.tf.enableProdMode();
    }
  } catch (e) {
    console.warn("TF ENV config:", e);
  }

  const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights";
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  faceModelsAlreadyLoaded = true;
  console.log('TF.js backend aktif:', faceapi.tf.getBackend());
}

async function executeFaceDetection(inputCanvas) {
  const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.3 });
  const doInference = async () => {
    return await faceapi.detectSingleFace(inputCanvas, detectorOptions)
      .withFaceLandmarks()
      .withFaceDescriptor();
  };

  try {
    // 1. Coba dengan WebGL (cepat ~100ms) dengan batas waktu 5 detik
    return await withTimeout(doInference(), 5000, "WebGL stall");
  } catch (webglErr) {
    console.warn("WebGL timeout/gagal di perangkat ini, beralih ke backend CPU fallback:", webglErr.message);
    // 2. Auto-fallback ke CPU Backend jika WebGL GPU hang di HP tertentu (Samsung/Android)
    try {
      if (faceapi.tf && faceapi.tf.getBackend() !== 'cpu') {
        await faceapi.tf.setBackend('cpu');
        console.log("Backend sukses switch ke CPU");
      }
      return await withTimeout(doInference(), 8000, "Gagal memproses wajah di perangkat.");
    } catch (cpuErr) {
      console.error("CPU fallback error:", cpuErr);
      throw cpuErr;
    }
  }
}

// Bungkus promise dengan batas waktu -- kalau lebih dari `ms` belum selesai,
// dianggap gagal (daripada macet selamanya tanpa kejelasan ke user).
function withTimeout(promise, ms, timeoutMessage) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(timeoutMessage)), ms))
  ]);
}

// CATATAN: fitur "warm-up" sempat ditambahkan di sini (jalan di background
// begitu kamera nyala) dengan niat mempercepat deteksi pertama. Ternyata
// dari hasil test-minimal-v2.html, deteksi asli cuma butuh <1 detik tanpa
// warm-up sama sekali -- dan warm-up yang jalan TANPA sinkronisasi ini
// JUSTRU jadi penyebab hang (2 proses deteksi berat rebutan WebGL kalau
// user keburu tekan Scan sebelum warm-up selesai). Makanya DIHAPUS TOTAL.

async function startFaceOnlyCapture() {
  matchMode = "1:N";
  setStatus("Memuat model wajah...", "info");
  statusEl.style.display = "block";
  try {
    await withTimeout(loadFaceModelsWithBackendFix(), 15000, "Timeout memuat model (15 detik). Coba refresh halaman.");
  } catch (e) {
    setStatus("❌ Gagal memuat model wajah: " + e.message, "fail");
    showRetry();
    return;
  }

  setStatus("Mengambil data wajah karyawan...", "info");
  try {
    if (isOfflineMode) {
      allFaceData = await getCachedFaces();
    } else {
      allFaceData = await callApi("GET_ALL_FACE_DATA", {});
    }
  } catch (e) {
    setStatus("❌ Gagal ambil data wajah: " + e.message, "fail");
    showRetry();
    return;
  }
  if (!allFaceData || allFaceData.length === 0) {
    setStatus("❌ Belum ada data wajah terdaftar sama sekali. Hubungi admin.", "fail");
    showRetry();
    return;
  }

  try {
    await ensureCameraStream(currentFacingModeFace);
  } catch (e) {
    setStatus("❌ Gagal akses kamera: " + e.message, "fail");
    showRetry();
    return;
  }

  setStatus("Posisikan wajah di kotak, lalu tekan Scan Wajah.", "info");
  btnScanFace.style.display = "block";
  btnScanFace.disabled = false;
  guideLoop();
  document.getElementById("btnSwitchFaceCam").style.display = "block";
}

  // readyState eksplisit (biasanya cuma sepersekian detik, tapi penting).
  let waitCount = 0;
  while (video.readyState < video.HAVE_ENOUGH_DATA && waitCount < 50) {
    await new Promise(r => setTimeout(r, 100));
    waitCount++;
  }
  if (video.readyState < video.HAVE_ENOUGH_DATA) {
    setStatus("❌ Kamera belum siap (video belum ada frame). Coba lagi.", "fail");
    btnScanFace.disabled = false;
    showRetry();

  }

  // ===== DEBUG SNAPSHOT (sementara, buat cek kenapa A55/A56 stuck) =====
  /*try {

  } catch (dbgErr) {

  // ===== END DEBUG SNAPSHOT =====

  setStatus("Mendeteksi wajah...", "info");

  // Validasi posisi/ukuran -- tolak kalau wajah terlalu jauh/dekat/nggak di tengah

    guideLoop();
    return;
  }

  if (matchMode === "1:N") {

  let sorted = allFaceData.map(p => ({
      qrCodeId: p.qrCodeId,
      nama: p.nama,
      distance: faceapi.euclideanDistance(detection.descriptor, p.descriptor)
    })).sort((a, b) => a.distance - b.distance);

    const best = sorted[0];
    const secondBest = sorted[1];
    const AMBIGUITY_MARGIN = 0.12; // diperketat dari 0.08 -- lebih gampang dianggap "ragu-ragu", minta QR

    const withinThreshold = best && best.distance <= FACE_MATCH_THRESHOLD;
    const isAmbiguous = secondBest && (secondBest.distance - best.distance) < AMBIGUITY_MARGIN;

      const matchInfoEl = document.getElementById('matchInfo');
      matchInfoEl.style.display = "block";

      checkSpecialFlowsThenProceed();
    } catch (e) {
      setStatus("❌ Gagal ambil data: " + e.message, "fail");
      showRetry();
    }
    return;
  }

  // ---- Mode 1:1 (identitas sudah pasti dari QR) ----
  const distance = faceapi.euclideanDistance(detection.descriptor, refDescriptor);
  const matched = distance <= FACE_MATCH_THRESHOLD;

  if (!matched) {
    setStatus("❌ Wajah tidak cocok (jarak: " + distance.toFixed(3) + "). Absen ditolak.", "fail");
    showRetry();
    return;
  }

  setStatus("✅ Wajah cocok! Melanjutkan absensi...", "ok");
  stopGuideLoop();
  stopCamera();
  faceVerified = true;

  const matchInfoEl1to1 = document.getElementById('matchInfo');

  matchInfoEl1to1.innerText = `✅ Terdeteksi: ${currentPerson.NamaPersonnel} (${qrCodeId})`;

    doSubmitAbsensi("");

    setStatus("Verifikasi wajah selesai. Masukkan password otorisasi.", "ok");

async function doSubmitAbsensi(password) {

  }
}

function handleAbsensiResponse(response) {
  let statusBersih = "", pesanBersih = "";
  if (response && typeof response === 'object') {
    statusBersih = String(response.status || "").toUpperCase().trim();
    pesanBersih = response.message || response.pesan || JSON.stringify(response);
  } else {
    let strRaw = String(response || "").trim();
    statusBersih = strRaw.toUpperCase().indexOf("SUKSES") !== -1 ? "SUKSES" : strRaw;
    pesanBersih = strRaw;
  }

  if (pesanBersih === "BUTUH_PASSWORD" || pesanBersih === "BUTUH_PASSWORD_CHECKOUT") {
    setStatus("Diperlukan password otorisasi.", "info");
    passwordCard.style.display = "block";
    return;
  }

  if (pesanBersih === "BUTUH_SPKL" || statusBersih === "NEED_VOUCHER") {
    setStatus("Sesi reguler sudah CLOSED. Masukkan Voucher PIN untuk lembur.", "info");
    voucherCard.style.display = "block";
    return;
  }

  // Hasil akhir (SUKSES / REJECTED / lainnya)
  setStatus("", "");
  statusEl.style.display = "none";
  let bersih = pesanBersih.replace("REGULER_SUKSES:", "");
  let kind = bersih.toUpperCase().indexOf("SUKSES") !== -1 ? "ok" : "fail";
  showResultCard(bersih, kind);
}

function showResultCard(text, kind) {
  const badgeMap = { masuk1:"badge-masuk1", istirahat:"badge-istirahat", masuk2:"badge-masuk2", pulang:"badge-pulang" };
  resultBanner.style.display = "block";
  resultBanner.className = kind === "ok" ? "banner-ok" : "banner-fail";
  resultBanner.innerHTML = (kind === "ok" ? "✅ " : "❌ ") + text;

  if (pendingPindahReminder) {
    const reminderEl = document.createElement('div');
    reminderEl.className = "banner-warn";
    reminderEl.style.display = "block";
    reminderEl.style.marginTop = "10px";
    reminderEl.innerText = pendingPindahReminder;
    resultBanner.parentNode.insertBefore(reminderEl, resultBanner.nextSibling);
  }

  const btnDone = document.createElement('button');
  btnDone.className = "btn-block btn-primary";
  btnDone.innerText = "Selesai";
  btnDone.onclick = () => location.href = location.pathname;
  resultBanner.parentNode.insertBefore(btnDone, resultBanner.nextSibling);
}

// ============ 0. SCAN QR (kalau belum ada QrCodeId dari URL) ============
let currentFacingModeQR = "user"; // default kamera depan -- disamakan dengan fase wajah biar 1 sesi kamera nyambung terus

async function ensureCameraStream(facingMode) {
  if (video.srcObject) {
    // Kamera udah nyala (dari fase sebelumnya) -- pakai terus, jangan restart
    wrap.style.display = "block";
    return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  wrap.style.display = "block";
}

async function restartCameraStream(facingMode) {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  await ensureCameraStream(facingMode);
}

document.getElementById('btnStartQrScan').onclick = async () => {
  document.getElementById('btnStartQrScan').disabled = true;
  try {
    await ensureCameraStream(currentFacingModeQR);
    qrGuide.style.display = "block";
    document.getElementById('btnSwitchQrCam').style.display = "block";
    setStatus("Arahkan QR badge Anda ke kamera...", "info");
    statusEl.style.display = "block";
    qrScanning = true;
    scanQRLoop();
  } catch (e) {
    setStatus("❌ Gagal akses kamera: " + e.message, "fail");
    statusEl.style.display = "block";
    document.getElementById('btnStartQrScan').disabled = false;
  }
};

document.getElementById('btnSwitchQrCam').onclick = async () => {
  currentFacingModeQR = currentFacingModeQR === "environment" ? "user" : "environment";
  try {
    await restartCameraStream(currentFacingModeQR);
    setStatus(`Kamera diganti ke: ${currentFacingModeQR === "user" ? "Depan" : "Belakang"}. Arahkan QR ke kamera...`, "info");
  } catch (e) {
    setStatus("❌ Gagal ganti kamera: " + e.message, "fail");
  }
};

async function scanQRLoop() {
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  while (qrScanning) {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
      if (code && code.data) {
        qrScanning = false;
        qrGuide.style.display = "none";
        document.getElementById('btnSwitchQrCam').style.display = "none";

        const rawData = code.data.trim();
        let extractedId = rawData;
        try {
          const url = new URL(rawData);
          const paramId = url.searchParams.get('QrCodeId') || url.searchParams.get('qrCodeId') || url.searchParams.get('qrcodeid');
          if (paramId) extractedId = paramId;
        } catch (e) { /* bukan URL, pakai apa adanya */ }

        qrCodeId = extractedId.trim().toUpperCase();
        setStatus("✅ QR terbaca: " + qrCodeId, "ok");

        // Kamera TIDAK dimatikan -- lanjut dipakai buat fase verifikasi wajah
        qrCard.style.display = "none";
        document.getElementById('entryCard').style.display = "none";

        if (activeLocation) {
          proceedWithQr(); // GPS sudah terkunci sebelumnya (skenario fallback dari mode wajah) -> skip initGPS ulang
        } else {
          initGPS();
        }
        return;
      }
    }
    await new Promise(r => setTimeout(r, 120));
  }
}

// ============ START ============
// GPS selalu dikunci duluan (baik lewat redirect QR fisik maupun buka langsung).
// Setelah lokasi valid, handleLocationResult() yang nentuin lanjut otomatis
// (kalau qrCodeId sudah ada dari URL) atau munculin pilihan Face-First/QR.
if (navigator.onLine) {
  syncFaceCache().catch(err => console.warn("Sync cache wajah gagal:", err));
}
initGPS();
